{# ช่องลงชื่อท้ายรายงาน: แถวละ 3 คน "ลงชื่อ ......... ตำแหน่ง" / "(ชื่อ)" แบบท้ายชีตเดิม #}
{% if signers %}
<div class="signs">
  {% for s in signers %}
  <div class="sign">
    <p class="sign-line">ลงชื่อ ................... {{ s.role }}</p>
    <p>({{ s.name or "......................................" }})</p>
  </div>
  {% endfor %}
</div>
{% endif %}
