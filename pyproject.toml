[project]
name = "krupan"
version = "0.9.0"
description = "ระบบวัสดุสิ้นเปลืองและทะเบียนครุภัณฑ์สำหรับที่ว่าการอำเภอ (demo ข้อมูลสมมติ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.163.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
    "qrcode[pil]>=8.2",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
